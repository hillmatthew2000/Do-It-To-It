spring.application.name=do-it-to-it

# Where tasks are stored. Override with --todo.data-dir=<path> (or TODO_DATA_DIR) to keep data elsewhere.
todo.data-dir=${user.home}/.do-it-to-it
# AUTO_SERVER lets the console and the web app use the same database at the same time.
spring.datasource.url=jdbc:h2:file:${todo.data-dir}/tasks;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Comma-separated origins allowed to call /api/** from a browser. Empty = same-origin only.
todo.cors.allowed-origins=
