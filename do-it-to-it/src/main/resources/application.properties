spring.application.name=do-it-to-it

# Where tasks are stored. Override with --todo.data-dir=<path> (or TODO_DATA_DIR) to keep data elsewhere.
todo.data-dir=${user.home}/.do-it-to-it
# AUTO_SERVER lets the console and the web app use the same database at the same time.
spring.datasource.url=jdbc:h2:file:${todo.data-dir}/tasks;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Comma-separated origins allowed to call /api/** from a browser. Empty = same-origin only.
todo.cors.allowed-origins=

# Operations: /actuator/health (including the database) and /actuator/info (build details).
management.endpoints.web.exposure.include=health,info
management.info.java.enabled=true

# API documentation: /swagger-ui.html (interactive) and /v3/api-docs (OpenAPI JSON).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true

# Logging: INFO by default, WARN for chatty libraries. Add --logging.file.name=<path> to also log to a file.
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
