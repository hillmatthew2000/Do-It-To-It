# Keep the terminal free of framework output while the interactive console is running.
spring.main.banner-mode=off
spring.main.log-startup-info=false
# Only errors reach the terminal; the full log goes to a file next to the data so problems can still
# be diagnosed. Override with --logging.file.name=<path>.
logging.threshold.console=ERROR
logging.file.name=${todo.data-dir}/logs/console.log
